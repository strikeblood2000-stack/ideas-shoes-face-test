<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDEAS SHOES - Face Detection V2</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;text-align:center;padding:16px;color:#202b38}
main{max-width:480px;margin:auto}h2{margin-bottom:4px}.sub{color:#5e6975;font-size:14px}
.frame{position:relative;width:100%;background:#20242a;border-radius:14px;overflow:hidden;aspect-ratio:3/4}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{pointer-events:none}
button{padding:13px 18px;margin:9px 5px;border:0;border-radius:9px;background:#1769aa;color:white;font-size:16px}button:disabled{opacity:.5}#stop{background:#555}
#status{background:white;border-radius:10px;padding:13px;line-height:1.5;min-height:40px}.note{font-size:13px;color:#667}
</style>
</head>
<body><main>
<h2>IDEAS SHOES</h2><p class="sub">Employee Face Detection — 测试版</p>
<div class="frame"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
<div><button id="start">开启摄像头与人脸检测</button><button id="stop">关闭</button></div>
<div id="status" role="status" aria-live="polite">点击开启，首次使用需要下载人脸检测模型。</div>
<p class="note">仅检测是否有人脸，不识别身份、不储存或上传照片。检测结果不能用于正式打卡。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('overlay'),statusBox=document.getElementById('status');
const startBtn=document.getElementById('start');let stream=null, running=false, modelReady=false, busy=false;
function status(s){statusBox.textContent=s}
async function loadModel(){
 if(modelReady)return;
 if(!window.faceapi)throw Error('人脸检测程序未加载，请检查网络。');
 status('正在下载人脸检测模型，请稍候…');
 await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model');
 modelReady=true;
}
function drawBox(box,w,h){const ctx=canvas.getContext('2d');ctx.strokeStyle='#2de06f';ctx.lineWidth=4;ctx.strokeRect(box.x,box.y,box.width,box.height)}
async function scan(){
 if(!running||busy)return;busy=true;
 try{
  if(video.readyState<2)return;
  const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);
  const faces=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5}));
  if(!running)return;
  if(faces.length===0)status('未检测到人脸，请面向镜头并保持光线充足。');
  else if(faces.length===1){drawBox(faces[0].box,w,h);status('检测成功：画面中有 1 张人脸。注意：尚未验证身份。')}
  else status('检测到 '+faces.length+' 张人脸，请确保镜头前只有 1 人。');
 }catch(e){status('检测失败：'+e.message)}finally{busy=false}
}
let timer=null;
async function start(){
 if(running)return;startBtn.disabled=true;
 try{
  await loadModel();
  status('正在请求前置摄像头权限…');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
  video.srcObject=stream;await video.play();running=true;
  status('摄像头已开启，正在检测…');
  timer=setInterval(scan,450);
 }catch(e){status('无法启动：'+e.message);stop()}finally{startBtn.disabled=false}
}
function stop(){running=false;if(timer){clearInterval(timer);timer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height)}
startBtn.addEventListener('click',start);document.getElementById('stop').addEventListener('click',()=>{stop();status('已关闭摄像头。')});window.addEventListener('pagehide',stop);
</script></body></html>
